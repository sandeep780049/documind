name: documind

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: documind-db
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    container_name: documind-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://documind:documind@db:5432/documind
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence_transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - hf_cache:/home/documind/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Optional local LLM. Start with: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: documind-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # One-shot helper that downloads the model after Ollama starts.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    entrypoint: ["/bin/sh", "-c", "sleep 8 && ollama pull $${OLLAMA_MODEL}"]

volumes:
  db_data:
  uploads:
  ollama_data:
  hf_cache:
