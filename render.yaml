services:
  - type: web
    name: documind-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: documind-db
          property: connectionString
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSION
        value: "1536"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: ""
      - key: RATE_LIMIT_DEFAULT
        value: 120/minute
      - key: RATE_LIMIT_CHAT
        value: 20/minute
      - key: RATE_LIMIT_UPLOAD
        value: 10/minute

databases:
  - name: documind-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
